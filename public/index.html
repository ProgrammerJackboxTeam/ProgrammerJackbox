<!DOCTYPE html>
<html>
<head>
    <title>Simple Lobby</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .hidden { display: none; }
        table { border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid #ccc; padding: 6px 12px; }
    </style>
</head>
<body>

<h2>Enter Your Name</h2>
<input id="nameInput" type="text" placeholder="Your name">
<button onclick="submitName()">Continue</button>

<div id="menu" class="hidden">
    <h2>Main Menu</h2>
    <button onclick="hostLobby()">Host a Lobby</button>
    <button onclick="showJoin()">Join a Lobby</button>
    <hr>
    <button onclick="window.location.href='/codeTyper/'">Play Code Typer (Solo)</button>
    <button onclick="window.location.href='/flexboxSpider/'">Play Flexbox Spider (Solo)</button>
</div>

<div id="joinSection" class="hidden">
    <h3>Join Lobby</h3>
    <input id="joinCode" type="text" placeholder="Room code">
    <button onclick="joinLobby()">Join</button>
    <button onclick="back()">Back</button>
</div>

<div id="hostSection" class="hidden">
    <h3>Hosting Lobby</h3>
    <p>Your room code:</p>
    <h2 id="roomKey"></h2>

    <h3>Players:</h3>
    <table id="playerTable">
        <tr><th>Name</th></tr>
    </table>

    <button onclick="back()">Close Lobby</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
